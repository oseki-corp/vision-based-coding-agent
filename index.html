<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrospective Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="retro-board">
        <div class="main-sections">
            <div class="section start-section">
                <div class="section-header">
                    <div class="section-icon start-icon"></div>
                    <h2>Start</h2>
                </div>
                <p class="section-subtitle">What should we START doing?</p>
                <div class="section-content">
                    <div class="sticky-note start-note"></div>
                </div>
            </div>

            <div class="section stop-section">
                <div class="section-header">
                    <div class="section-icon stop-icon"></div>
                    <h2>Stop</h2>
                </div>
                <p class="section-subtitle">What should we STOP doing?</p>
                <div class="section-content">
                    <div class="sticky-note stop-note"></div>
                </div>
            </div>

            <div class="section continue-section">
                <div class="section-header">
                    <div class="section-icon continue-icon"></div>
                    <h2>Continue</h2>
                </div>
                <p class="section-subtitle">What should we CONTINUE doing?</p>
                <div class="section-content">
                    <div class="sticky-note continue-note"></div>
                </div>
            </div>

            <div class="section kudos-section">
                <div class="section-header">
                    <div class="section-icon kudos-icon"></div>
                    <h2>Kudos</h2>
                </div>
                <p class="section-subtitle">Shout outs to this amazing team!!!</p>
                <div class="section-content">
                    <div class="sticky-note kudos-note"></div>
                </div>
            </div>
        </div>

        <div class="action-items-section">
            <div class="action-header">
                <div class="action-icon"></div>
                <h2>Action Items</h2>
            </div>
            <p class="action-subtitle">Action items before the next retro</p>
            <div class="action-content">
                <div class="action-note action-note-1"></div>
                <div class="action-note action-note-2"></div>
                <div class="lightbulb-icon"></div>
            </div>
        </div>
    </div>
</body>
</html>
